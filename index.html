  stay:"宿 <b>Yaya's House（Lake Hāwea）</b> 🏔️<b>「Lake Hāwea 慢生活小屋」</b>　Airbnb · 房東 Rebecca · 17 Noema Terrace, Lake Hāwea · TWD 4,350.05 · ✅ 已訂（10/25→26）· Airbnb 確認碼 HMR88SR35W · 10/9 收款 · 入住 10/25 15:00／退房 10/26 10:00 · 🏠 哈威亞湖畔小屋 · 🧺 有洗衣機（照片可見）· 🛏 整套小屋（床型問房東 Rebecca）· ☕ 早餐可步行 5 分到 Hawea Store & Kitchen（湖景·7:30 開）",note:"🚁 <b>直升機 ✅ 已訂（Klook KNN754425·憑證 RPFD1NS）</b>：庫克山法蘭茲和福克斯魔幻之旅（60 分）· 10/25（日）<b>10:00</b> · 成人×2 · 領隊 HSU WENHSIN<br>🏢 供應商 <b>Air Safaris</b> · 📍 集合 <b>Lake Tekapo Airport（State Highway 8, Tekapo 7945）</b>·村莊南邊開車 3 分·離住宿約 5 分<br>⏰ <b>出發前 15 分報到</b>（櫃檯出示憑證換實體票）· ☎ +64 3 680 6880<br>✅ 亮點：雪地降落 Liebig Dome 7700ft、庫克山 3,724m、<b>Franz Josef／Fox 冰河</b>、塔斯曼冰川＋終端湖、約翰山天文台<br>⚖️ 體重上限 130kg·報到秤重排座位 · 👕 帶：太陽眼鏡、帽子、<b>厚保暖衣</b>、步行鞋、防曬 · <b>勿帶鬆散物品</b><br>⚠️ <b>需 4 人成團</b>——出發前一天務必致電 <b>0800 806 880／03 680 6880</b> 確認是否成團＋天氣；未成團會改期或全額退款<br>🌥 10/24 10:00（NZ）前可免費取消<br><br>🌿 <b>備案 · 若直升機沒成團／天氣取消（同樣是大自然，全在 Tekapo 周邊、開車 5–15 分）</b><br>　① <b>Mt John 山頂步道</b>（★4.7）——爬 1 小時登頂，居高臨下看整片 Tekapo 湖與麥肯齊盆地，是冰河刨蝕出來的地貌；山頂有咖啡館可歇腳。天氣好走環線（約 2h），不好就原路折返。<a href=\"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=Mt%20John%20Summit%20Track%2C%20Lake%20Tekapo\" style=\"color:inherit\">📍導航</a><br>　② <b>Lake Alexandrina 秘境湖</b>（★4.5）——離 Tekapo 10 分的寧靜高山湖，<b>沒有遊覽車、只有鳥叫</b>，浮巢水鳥、天鵝、山景倒影，適合放空野餐拍照。碎石路 2WD 可進，或停路口走 30 分。<a href=\"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=Lake%20Alexandrina%2C%20Canterbury\" style=\"color:inherit\">📍導航</a><br>　③ <b>Tekapo Springs 溫泉</b>（★4.4·11:00 開·週末 10:00）——天氣差最推！泡湯看湖景雪山，有蒸氣室與冷水池，全日票。<a href=\"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=Tekapo%20Springs%2C%20300%20Lakeside%20Drive%2C%20Lake%20Tekapo\" style=\"color:inherit\">📍導航</a><br>　④ <b>好牧羊人教堂＋湖畔步道</b>——湖邊經典石教堂，順著湖岸慢慢走，隨手拍都是明信片。<a href=\"https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=Church%20of%20the%20Good%20Shepherd%2C%20Lake%20Tekapo\" style=\"color:inherit\">📍導航</a><br>　💡 建議組合：<b>Mt John 登頂（09:00–11:00）→ 山頂咖啡 → 下山泡 Tekapo Springs</b>，中午前結束、11:30 一樣南下接牛奶湖午餐，<b>後面行程完全不受影響</b>。<br><br><br>🐟 <b>午餐：High Country Salmon（高地鄉村鮭魚）</b><br>📍 2602 Twizel-Omarama Rd, Twizel（<b>就在 SH8 路邊·南下必經</b>）· 🕐 <b>每天 10:00–19:00</b> · ★4.3（近 6,000 則）<br>🍽 鮭魚養在南阿爾卑斯冰川融水中，肉質緊實鮮甜。必點 <b>鮭魚 carpaccio</b>、生魚片、<b>Boston 式鮭魚巧達湯</b>；餐點種類多（連漢堡都有），<b>還可免費餵鮭魚</b>"},

});

const prep=document.createElement('section');prep.className='page';prep.innerHTML=`<div class="dtop"><span class="k">出發前 / BEFORE</span><span class="k">行前準備 · 打勾</span></div><header class="dhero"><div class="hn">出發前先看 · Before You Go</div><h1>🎒 行前準備</h1><div class="hvibe">出發前逐項打勾 · Pre-trip Checklist</div></header><div class="near" style="margin-top:2px;padding:12px 15px;border-radius:12px;background:#fff7ed;border:1px solid #f5d9b0;font-size:13.5px;color:#7a5a2e;line-height:1.85"><div style="font-weight:700;color:#b5651d;margin-bottom:5px">🌅 每天日出／日落（NZ 夏令時 · 已按當天所在地計算）</div>紐西蘭 10 月底<b>日照很長</b>——日落約 <b>20:10–20:30</b>、天全黑要到 <b>21:00</b> 左右，傍晚活動、拍夕陽、看極光時間都很充裕。<br><table style="width:100%;border-collapse:collapse;margin-top:7px;font-size:12.5px"><tr style="color:#9a7b52;text-align:left"><th style="padding:2px 4px">日</th><th>地點</th><th>日出</th><th>日落</th><th>天黑</th></tr><tr><td style="padding:2px 4px">D1</td><td>Oamaru</td><td>06:29</td><td>20:11</td><td>20:43</td></tr><tr><td style="padding:2px 4px">D2</td><td>Tekapo</td><td>06:32</td><td>20:13</td><td>20:44</td></tr><tr><td style="padding:2px 4px">D3</td><td>Lake Hāwea</td><td>06:34</td><td>20:20</td><td>20:52</td></tr><tr><td style="padding:2px 4px">D4</td><td>皇后鎮</td><td>06:34</td><td>20:25</td><td>20:57</td></tr><tr><td style="padding:2px 4px">D5</td><td>Te Anau</td><td>06:35</td><td>20:31</td><td>21:03</td></tr><tr><td style="padding:2px 4px">D6</td><td>Te Anau</td><td>06:34</td><td>20:32</td><td>21:05</td></tr><tr><td style="padding:2px 4px">D7</td><td>皇后鎮</td><td>06:29</td><td>20:29</td><td>21:01</td></tr><tr><td style="padding:2px 4px">D8</td><td>皇后鎮</td><td>06:28</td><td>20:30</td><td>21:03</td></tr></table><div style="font-size:12px;color:#a08050;margin-top:5px">💡 D8 早晨採買趁早；孤獨之樹（D3 傍晚）日落 20:20、Te Anau 湖畔夕陽（D5）20:31，不用趕。看極光在天黑後（21:00＋）最暗。</div></div><section class="book"><div class="bkgrp">⚠️ 安全・健康（最容易漏掉，先看這組）</div><label class="bkrow"><input type="checkbox"><span class="bkic">🦟</span><div><b>防沙蠅噴劑（Fiordland 必備）</b><div class="bkch">Te Anau／Milford（D5–D6）沙蠅（sandfly）非常兇，湖邊、船上、步道都會叮，又癢又腫好幾天。帶含 DEET 或 picaridin 的噴劑，長袖薄外套；當地超市／i-SITE 也買得到</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🛡</span><div><b>旅平險＋海外醫療險</b><div class="bkch">紐西蘭醫療自費很貴；保含醫療＋緊急後送。另確認租車是否加保「降低自負額（excess reduction）」，取車時可加購</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">💊</span><div><b>常備／慢性藥・英文藥單</b><div class="bkch">帶足全程＋多備 3–5 天，放<b>隨身行李</b>（托運可能延誤）、保留原包裝；請醫師開英文診斷／藥品清單備查。常備藥：暈車、止痛、腸胃、感冒</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">❄️</span><div><b>D4 皇冠山口（Crown Range）路況</b><div class="bkch">紐西蘭最高柏油公路（約 1076 m），5–10 月仍可能積雪結冰、依規定需攜帶雪鏈。10/26 出發前查 NZTA 路況／山頂 webcam；取車時問 Budget 有無附雪鏈。不放心可改走 Cromwell／SH6 較低的替代路線（較遠但安全）</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🚨</span><div><b>緊急電話 111（警消救護通用）</b><div class="bkch">紐西蘭報案／救護／消防都撥 111。山區與 Milford 公路常無訊號，重要導航先離線下載；行程表各印一份紙本隨身帶著</div></div></label><div class="bkgrp">📄 證件・簽證（最重要，先辦）</div><label class="bkrow"><input type="checkbox"><span class="bkic">🛂</span><div><b>護照效期 6 個月以上</b><div class="bkch">回程 10/31，效期建議到 2027 年 5 月後</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🇳🇿</span><div><b>紐西蘭 NZeTA 電子簽證 ＋ IVL 旅遊稅</b><div class="bkch">官網／App 線上申請，出發前至少 72 小時辦好</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">📝</span><div><b>紐西蘭旅客申報 NZTD（New Zealand Traveller Declaration）</b><div class="bkch">入境前 24 小時內線上／App 填寫，拿到申報單條碼；含健康、行李、生物安全申報</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🇦🇺</span><div><b>澳洲 ETA 過境簽證</b><div class="bkch">經布里斯本轉機必辦！用 Australian ETA App 申請</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🚗</span><div><b style="color:#c0392b">🔴 國際駕照 ＋ 台灣駕照正本（最重要！沒帶租不到車）</b><div class="bkch"><b>兩者都要帶、缺一不可</b>——Budget 取車時<b>兩張一起查驗</b>，只帶其中一張會拒租、整趟自駕泡湯。<br>📋 <b>國際駕照</b>：到監理站當場辦、約 250 元、帶護照＋台灣駕照＋照片；<b>效期別過期</b>（通常 3 年，確認到 2026/10 後仍有效）<br>📋 <b>台灣駕照正本</b>（不是影本）——國際駕照本身要搭配母國駕照才有效<br>💡 建議：兩張都<b>拍照存手機＋雲端</b>備份；正本放隨身、別托運</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🎫</span><div><b>機票／訂房／租車／KKday 憑證</b><div class="bkch">存手機＋印一份紙本備份</div></div></label><div class="bkgrp">🚗 自駕準備</div><label class="bkrow"><input type="checkbox"><span class="bkic">⬅️</span><div><b>熟悉「靠左行駛」、圓環讓右</b></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🛡</span><div><b>租車全險已確認</b><div class="bkch">Budget · Zero Excess＋ADR＋RSN · 編號 49160913TW4</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🗺</span><div><b>下載離線地圖（Google Maps 南島）＋加油 App</b></div></label><div class="bkgrp">🧳 行李・穿搭（10 月春天・日夜溫差大）</div><label class="bkrow"><input type="checkbox"><span class="bkic">🧥</span><div><b>洋蔥式穿搭＋防風防水外套</b><div class="bkch">看企鵝／觀星要保暖帽手套</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🥾</span><div><b>健行鞋（入境前刷乾淨、無泥土）</b></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🌧</span><div><b>防水衣物 ＋ 防水鞋（重要）</b><div class="bkch">Milford、峽灣、山區常下雨；防水外套＋防水／快乾鞋或鞋套，襪子多帶幾雙</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🕶</span><div><b>太陽眼鏡、防曬</b><div class="bkch">南島紫外線很強</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🔌</span><div><b>萬用轉接頭（紐澳 I 型三腳插）</b></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">💊</span><div><b>個人常備藥（原包裝）、環保購物袋</b></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🧂</span><div><b>煮飯調味料（小罐／分裝包）</b><div class="bkch">鹽、油、醬油、胡椒、雞湯塊／味精、蒜、辣椒醬；可帶幾包泡麵／乾燥食材。住宿自己煮用，紐西蘭超市整罐買較貴又帶不完</div></div></label><label class="bkrow"><input type="checkbox"><span class="bkic">🥢</span><div><b>筷子 ＋ 煮水器（快煮壺）</b><div class="bkch">🥢 <b>筷子</b>：紐西蘭住宿多半只有刀叉，帶環保筷（可再帶湯匙／小碗）<br>🫖 <b>煮水器</b>：多數住宿有電熱水壺，但機場夜（LyLo）與趕路時自帶小型快煮壺較保險——泡茶、泡麵、沖泡飲品都方便<br>⚡ <b>電壓：紐西蘭 23     <div class="wxhead"><span>🌤 ${w.place} · 當地天氣</span>
      <button class="wxbtn" onclick="fetchWx(${n},this)">🔄 抓取當日</button></div>
    <div class="wxclim">📅 <b>10 月平均</b>：${w.clim}</div>
    <div class="wxout" id="wxout-${n}"><span class="wxmuted">點「抓取當日」看即時天氣（行程當天最準）</span></div>
  </div>`;
}

async function fetchWx(n, btn){
  const w=WX[n]; const out=document.getElementById('wxout-'+n);
  const old=btn.textContent; btn.disabled=true; btn.textContent='抓取中…';
  out.innerHTML='<span class="wxmuted">連線中…</span>';
  try{
    const url=`https://api.open-meteo.com/v1/forecast?latitude=${w.lat}&longitude=${w.lng}`
      +`&current=temperature_2m,apparent_temperature,weather_code,wind_speed_10m,relative_humidity_2m`
      +`&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max`
      +`&timezone=Pacific%2FAuckland&forecast_days=1`;
    const r=await fetch(url); if(!r.ok) throw new Error('http');
    const j=await r.json(); const c=j.current, dy=j.daily;
    const [ic,desc]=WX_CODE[c.weather_code]||['🌡',''];
    const t=new Date((c.time||'').replace(' ','T'));
    const hhmm=isNaN(t)?'':t.toLocaleString('zh-TW',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit',hour12:false});
    const pp=(dy&&dy.precipitation_probability_max&&dy.precipitation_probability_max[0]!=null)?dy.precipitation_probability_max[0]+'%':'–';
    out.innerHTML=`
      <div class="wxnow"><span class="wxbig">${ic}</span>
        <div><div class="wxtemp">${Math.round(c.temperature_2m)}°C <span class="wxdesc">${desc}</span></div>
        <div class="wxsub">體感 ${Math.round(c.apparent_temperature)}° · 風 ${Math.round(c.wind_speed_10m)} km/h · 濕度 ${c.relative_humidity_2m}%</div></div></div>
      <div class="wxsub2">今日 高 ${Math.round(dy.temperature_2m_max[0])}° / 低 ${Math.round(dy.temperature_2m_min[0])}°　降雨機率 ${pp}</div>
      <div class="wxstamp">紐西蘭當地 ${hhmm} · 即時更新</div>`;
  }catch(e){
    out.innerHTML='<span class="wxmuted">⚠️ 抓取失敗，請確認有連網後再試一次</span>';
  }finally{ btn.disabled=false; btn.textContent=old; }
}

async function fetchAllWx(btn){
  const old=btn.textContent; btn.disabled=true; btn.textContent='全部抓取中…';
  for(const n of Object.keys(WX)){
    const b=document.querySelector(`#wxout-${n}`)?.closest('.wxcard')?.querySelector('.wxbtn');
    if(b) await fetchWx(Number(n), b);
  }
  btn.disabled=false; btn.textContent=old;
}

   ["D2 Kurow 小鎮（Waitaki 河谷中途）","Kurow, New Zealand"],
   ["D2 Omarama 公廁","Omarama Public Toilets"],
   ["D2 Tekapo 湖畔公廁（教堂旁）","Lake Tekapo Public Toilets"],
   ["D3 Lake Pukaki 觀景點公廁","Lake Pukaki Lookout Toilets"],
   ["D3 Twizel 鎮上","Twizel, New Zealand"],
   ["D4 Cardrona Hotel","Cardrona Hotel, Cardrona Valley Road"],
   ["D4 Arrowtown 鎮上","Arrowtown, New Zealand"],
   ["D5/D7 Kingston 湖尾休息點","Kingston, Southland, New Zealand"],
   ["D5 Mossburn／Lumsden","Lumsden, Southland"],
   ["D5 Te Anau i-SITE","Fiordland i-SITE Visitor Centre, Te Anau"],
   ["D7 皇后鎮 Steamer Wharf","Steamer Wharf, Queenstown"],
 ]},
};
const nav=document.createElement('section');nav.className='page';
let navHTML=`<header class="phead"><h1>🧭 導航</h1><div class="hvibe">開車直接點 · Tap to Navigate</div></header>
<div class="near" style="margin-top:2px;padding:11px 14px;border-radius:12px;background:#eef1f7;border:1px solid #cdd8ea;font-size:13.5px;color:#22324f;line-height:1.8">
💡 點任一地點即開啟 <b>Google Maps 導航</b>（自動用「開車」模式）。<br>
📶 山區與 Milford 公路常<b>無訊號</b>——出發前先在 Google Maps <b>下載離線地圖</b>（南島全區）。<br>
🚻 <b>找廁所</b>：紐西蘭每個鎮的 <b>i-SITE 遊客中心</b>都有免費乾淨公廁；<b>加油站、超市、觀景點</b>也多半有。長途中途已排好休息點（見下方 🚻 區）。</div>`;
Object.keys(NAV).forEach(k=>{
  const g=NAV[k];
  navHTML+=`<div class="blabel" style="color:#34507a;margin-top:14px">${g.t}</div><div style="display:flex;flex-direction:column;gap:7px;margin-top:7px">`;
  g.items.forEach(([name,q])=>{
    navHTML+=`<a href="https://www.google.com/maps/dir/?api=1&travelmode=driving&destination=${encodeURIComponent(q)}" target="_blank" rel="noopener" style="display:flex;align-items:center;justify-content:space-between;gap:10px;text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:var(--shadow)">
      <span style="font-size:14.5px;font-weight:600;color:#22324f;line-height:1.45">${name}</span>
      <span style="flex-shrink:0;background:#3b5bdb;color:#fff;font-size:12.5px;font-weight:700;border-radius:8px;padding:6px 11px;white-space:nowrap">📍 導航</span></a>`;
  });
  navHTML+=`</div>`;
});
navHTML+=`<p class="credit">導航總表 · 開車用 · Annie Hsu 馨製作</p>`;
nav.innerHTML=navHTML;stage.appendChild(nav);


// ---- tabs ----
const tabsEl=document.getElementById('tabs');
['D0','📋','航班','🛒','🐨',...DAYS.map(d=>'D'+d.n),'住宿','伴手禮','🎫','🧭'].forEach((t,i)=>{
  const b=document.createElement('div');b.className='tab';b.textContent=t;b.onclick=()=>go(i);tabsEl.appendChild(b);
});
const tabEls=[...tabsEl.children];
const pages=[...stage.children];

let cur=0;
const prevB=document.getElementById('prev'),nextB=document.getElementById('next'),indEl=document.getElementById('ind'),homeB=document.getElementById('home');
function go(i,dir){
  if(i<0||i>=pages.length)return;
  const d=dir||(i>cur?24:-24);cur=i;
  pages.forEach((p,k)=>p.classList.toggle('active',k===i));
  pages[i].style.setProperty('--dir',d+'px');void pages[i].offsetWidth;
  tabEls.forEach((t,k)=>t.classList.toggle('on',k===i));
  tabEls[i].scrollIntoView({inline:'center',block:'nearest',behavior:'smooth'});
  prevB.classList.toggle('off',i===0);nextB.classList.toggle('off',i===pages.length-1);
  indEl.innerHTML=i===0?'D0 · 去程':i===1?'📋 行前準備':i===2?'✈️ 航班':i===3?'🛒 超市':i===4?'🐨 布里斯本轉機':(i>=5&&i<=12)?`第 <b>${i-4}</b> 天 / 8`:i===13?'住宿':i===14?'🛍 伴手禮':'💰 費用總表';
  homeB.style.display=i===0?'none':'flex';
  window.scrollTo({top:0});
  if(history.replaceState)history.replaceState(null,'',i===0?'#':'#d'+i);
}
prevB.onclick=()=>go(cur-1);nextB.onclick=()=>go(cur+1);homeB.onclick=()=>go(0);
document.querySelectorAll('[data-go]').forEach(r=>r.onclick=()=>go(+r.dataset.go+2));
addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
let sx=0,sy=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
stage.addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;
  if(Math.abs(dx)>55&&Math.abs(dx)>Math.abs(dy)*1.4){dx<0?go(cur+1):go(cur-1);}
},{passive:true});
const m=(location.hash||'').match(/d(\d+)/);
go(m?Math.min(+m[1]+2,10):0);
</script>
